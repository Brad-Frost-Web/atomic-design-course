<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		rel="stylesheet"
		href="design-tokens/wowee-zowee/build/css/tokens.css"

		<link rel="stylesheet" href="design-tokens/our-company/css/fonts.css" />
		<link
			rel="stylesheet"
			href="design-tokens/our-company/build/css/tokens.css"
		/>
		<!-- Component Imports -->
		<script type="importmap">
			{
				"imports": {
					"lit": "https://esm.sh/lit@3",
					"lit/": "https://esm.sh/lit@3/"
				}
			}
		</script>
		<script type="module" src="components/header/header.js"></script>
		<script
			type="module"
			src="components/layout-container/layout-container.js"
		></script>
		<script type="module" src="components/page-header/page-header.js"></script>
		<script type="module" src="components/text-field/text-field.js"></script>
		<script
			type="module"
			src="components/textarea-field/textarea-field.js"
		></script>
		<script type="module" src="components/button/button.js"></script>
		<script type="module" src="components/form/form.js"></script>
		<script type="module" src="components/footer/footer.js"></script>
	</head>
	<body>
		<my-header class="u-margin-bottom-24"></my-header>

		<main class="main u-margin-bottom-80">
			<my-layout-container variant="narrow">
				<my-page-header
					class="u-margin-bottom-32"
					heading="Contact us"
				></my-page-header>
				<my-form>
					<my-text-field type="text" id="name" label="Name"></my-text-field>
					<my-text-field type="email" id="email" label="Email"></my-text-field>
					<my-textarea-field
						placeholder="Enter your message"
						id="message"
						label="Your Message"
					></my-textarea-field>
					<my-button type="submit">Submit</my-button>
				</my-form>
			</my-layout-container>
		</main>

		<my-footer></my-footer>
	</body>
</html>
