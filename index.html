<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Company</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
		<script type="importmap">
			{
				"imports": {
					"lit": "https://esm.sh/lit@3",
					"lit/": "https://esm.sh/lit@3/"
				}
			}
		</script>
		<script type="module" src="components/header/header.js"></script>
		<script type="module" src="components/hero/hero.js"></script>
		<script type="module" src="components/features/features.js"></script>
		<script type="module" src="components/band/band.js"></script>
		<script
			type="module"
			src="components/layout-container/layout-container.js"
		></script>
		<script type="module" src="components/heading/heading.js"></script>
		<script
			type="module"
			src="components/text-passage/text-passage.js"
		></script>
		<script type="module" src="components/text-field/text-field.js"></script>
		<script type="module" src="components/button/button.js"></script>
		<script type="module" src="components/card/card.js"></script>
		<script type="module" src="components/grid/grid.js"></script>
		<script type="module" src="components/footer/footer.js"></script>
	</head>
	<body>
		<my-header class="u-margin-bottom-48"></my-header>

		<main class="main">
			<my-layout-container>
				<my-hero class="u-margin-bottom-64"></my-hero>
				<section class="section u-margin-bottom-18">
					<my-heading tag-name="h2" variant="title" class="section__heading">
						Why Choose Us
					</my-heading>
					<my-grid variant="3up">
						<my-card
							heading="Feature One"
							description="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt."
						></my-card>
						<my-card
							heading="Feature Two"
							description="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt."
						></my-card>
						<my-card
							heading="Feature Three"
							description="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt."
						></my-card>
					</my-grid>
				</section>
			</my-layout-container>

			<my-band>
				<my-layout-container>
					<section class="section">
						<my-heading tag-name="h2" variant="title" class="u-margin-bottom-16"
							>Stay Updated</my-heading
						>
						<my-text-passage class="u-margin-bottom-32">
							Subscribe to our newsletter to receive the latest news and
							updates.
						</my-text-passage>
						<form class="newsletter-form">
							<my-text-field
								type="email"
								placeholder="Enter your email"
								class="newsletter-form__text-field"
							></my-text-field>
							<my-button type="submit" class="button">Subscribe</my-button>
						</form>
					</section>
				</my-layout-container>
			</my-band>
		</main>

		<my-footer></my-footer>
	</body>
</html>
