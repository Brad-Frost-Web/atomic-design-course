<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact Us - My Company</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header class="header">
			<div class="header__logo"></div>
			<nav class="header__nav">
				<ul class="nav-list">
					<li class="nav-list__item">
						<a href="/services.html" class="nav-list__link">Services</a>
					</li>
					<li class="nav-list__item">
						<a href="/about.html" class="nav-list__link">About</a>
					</li>
					<li class="nav-list__item">
						<a href="/contact.html" class="nav-list__link">Contact</a>
					</li>
				</ul>
			</nav>
		</header>

		<main class="contact">
			<h2 class="contact__title">Contact us</h2>
			<form class="contact__form">
				<div class="contact__field">
					<label class="contact__label" for="name">Name</label>
					<input type="text" id="name" class="contact__input" />
				</div>
				<div class="contact__field">
					<label class="contact__label" for="email">Email</label>
					<input type="email" id="email" class="contact__input" />
				</div>
				<div class="contact__field">
					<label class="contact__label" for="message">Your Message</label>
					<textarea id="message" class="contact__textarea"></textarea>
				</div>
				<button type="submit" class="contact__button">Submit</button>
			</form>
		</main>

		<footer class="footer">
			<nav class="footer__nav">
				<ul class="nav-list nav-list--footer">
					<li class="nav-list__item">
						<a href="#" class="nav-list__link nav-list__link--footer"
							>Services</a
						>
					</li>
					<li class="nav-list__item">
						<a href="#" class="nav-list__link nav-list__link--footer">About</a>
					</li>
					<li class="nav-list__item">
						<a href="#" class="nav-list__link nav-list__link--footer"
							>Contact</a
						>
					</li>
				</ul>
			</nav>
			<p class="footer__copyright">
				&copy; 2026 My Company. All rights reserved.
			</p>
		</footer>
	</body>
</html>
