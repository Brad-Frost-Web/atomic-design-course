<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact Us - Our Company</title>
		<!-- Styles -->
		<link rel="stylesheet" href="styles.css" />
		<!-- Component Imports -->
		<script type="importmap">
			{
				"imports": {
					"lit": "https://esm.sh/lit@3",
					"lit/": "https://esm.sh/lit@3/"
				}
			}
		</script>
		<script type="module" src="components/index.js"></script>
	</head>
	<body>
		<my-header class="u-margin-bottom-24"></my-header>

		<main class="main u-margin-bottom-80">
			<my-layout-container variant="narrow">
				<my-page-header
					class="u-margin-bottom-32"
					heading="Contact us"
				></my-page-header>
				<my-form>
					<my-text-field type="text" id="name" label="Name"></my-text-field>
					<my-text-field type="email" id="email" label="Email"></my-text-field>
					<my-textarea-field
						placeholder="Enter your message"
						id="message"
						label="Your Message"
					></my-textarea-field>
					<my-button type="submit">Submit</my-button>
				</my-form>
			</my-layout-container>
		</main>

		<my-footer></my-footer>
	</body>
</html>
