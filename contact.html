<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact Us - Our Company</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500&display=swap"
			rel="stylesheet"
		/>
		<script type="importmap">
			{
				"imports": {
					"lit": "https://esm.sh/lit@3",
					"lit/": "https://esm.sh/lit@3/"
				}
			}
		</script>
		<script type="module" src="components/index.js"></script>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<my-header class="u-margin-bottom-24"></my-header>

		<main class="main u-margin-bottom-72">
			<my-layout-container variant="narrow">
				<my-page-header
					class="u-margin-bottom-32"
					heading="Contact us"
				></my-page-header>
				<form class="form">
					<my-text-field type="text" id="name" label="Name"></my-text-field>
					<my-text-field type="email" id="email" label="Email"></my-text-field>
					<my-textarea-field
						placeholder="Enter your message"
						id="message"
						label="Your Message"
					></my-textarea-field>
					<my-button type="submit">Submit</my-button>
				</form>
			</my-layout-container>
		</main>

		<my-footer></my-footer>
	</body>
</html>
