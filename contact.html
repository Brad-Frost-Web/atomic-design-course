<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact Us - Our Company</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header class="header u-margin-bottom-48">
			<a href="./index.html" class="logo-link" aria-label="Our Company — home">
				<div class="logo"></div>
			</a>
			<nav class="primary-nav">
				<ul class="primary-nav__list">
					<li class="primary-nav__item">
						<a href="./services.html" class="primary-nav__link">Services</a>
					</li>
					<li class="primary-nav__item">
						<a href="./about.html" class="primary-nav__link">About</a>
					</li>
					<li class="primary-nav__item">
						<a href="./contact.html" class="primary-nav__link">Contact</a>
					</li>
				</ul>
			</nav>
		</header>

		<main class="main u-margin-bottom-72">
			<div class="layout-container layout-container--narrow">
				<h1 class="heading heading--title-lg u-margin-bottom-24">Contact us</h1>
				<form class="form">
					<div class="text-field">
						<label class="text-field__label" for="name">Name</label>
						<input type="text" id="name" class="text-field__input" />
					</div>
					<div class="text-field">
						<label class="text-field__label" for="email">Email</label>
						<input type="email" id="email" class="text-field__input" />
					</div>
					<div class="text-field">
						<label class="text-field__label" for="message">Your Message</label>
						<textarea id="message" class="text-field__textarea"></textarea>
					</div>
					<button type="submit" class="button form__button">Submit</button>
				</form>
			</div>
		</main>

		<footer class="footer">
			<nav class="footer-nav">
				<ul class="footer-nav__list">
					<li class="footer-nav__item">
						<a href="./services.html" class="footer-nav__link">Services</a>
					</li>
					<li class="footer-nav__item">
						<a href="./about.html" class="footer-nav__link">About</a>
					</li>
					<li class="footer-nav__item">
						<a href="./contact.html" class="footer-nav__link">Contact</a>
					</li>
				</ul>
			</nav>
			<p class="footer__copyright">
				&copy; 2026 Our Company. All rights reserved.
			</p>
		</footer>
	</body>
</html>
